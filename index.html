<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR project template</title>
    <script src="js/three.js"></script>
    <script src="js/tween.umd.js"></script>
    <script src='loaders/GLTFLoader.js'></script>
    <script src='loaders/GLTF2Loader.js'></script>
    <script src='loaders/MTLLoader.js'></script>
    <script src='loaders/OBJLoader.js'></script>
    <script src="jsartoolkit5/artoolkit.min.js"></script>
    <script src="jsartoolkit5/artoolkit.api.js"></script>
    <script src="threex/threex-artoolkitsource.js"></script>
    <script src="threex/threex-artoolkitcontext.js"></script>
    <script src="threex/threex-arbasecontrols.js"></script>
    <script src="threex/threex-armarkercontrols.js"></script>
</head>

<body style='margin : 0px; overflow: hidden; font-family: Monospace; user-select: none; pointer-events: none;'>

    <div id="access" style="top: 0; left: 0; right:0; bottom: 0; background: #000; position: absolute; user-select: all; pointer-events: all; cursor: pointer; z-index: 9999;">
        <div id="text-wrapper" style="top: 50%; left: 50%; position: absolute; color: #fff; transform: translate(-50%, -50%); text-align: center; text-transform: uppercase; font-family: Arial, Helvetica, sans-serif; font-weight: bold; line-height: 1.5em; font-size: large; white-space: nowrap; user-select: none; pointer-events: none;">
            Нажмите сюда
            <br>
            чтобы начать AR и включить звук
        </div>
    </div>

    <div id="loader" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #fff; pointer-events: none; user-select: none; transition: all .2s linear; display: none; z-index: 9998;">
        <div style="left: 50%; top: 50%; position: absolute; transform: translate(-50%, -50%); text-align: center; width: 130px; height: 165px; font-family: Arial, Helvetica, sans-serif; font-weight: 400; line-height: 1.5em; font-size: large;" class="spinner-wrapper">
            <img style="width: 130px; height: 130px; pointer-events: none; user-select: none;" src="data/spin.gif" alt="spin gif">
            <br>
            Loading...
        </div>
    </div>

    <script>
        const access = document.getElementById('access');
        const loader = document.getElementById('loader');

        function initiateExperience() {
            var scene, camera, renderer, clock, deltaTime, totalTime;
            var patternIdOffset = 10000000000;
            var arToolkitSource, arToolkitContext;
            var markerRoot, mainContainer;
            var contentPromises = [];

            let contentInitialized = false;
            let barcodesSound = new Map();
            let patternsSound = new Map();
            let barcodesID = [];
            let patternsID = [];
            let controller;

            initialize();
            animate();

            function initialize() {
                scene = new THREE.Scene();
                let ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
                scene.add(ambientLight);

                camera = new THREE.Camera();
                scene.add(camera);
                
                const listener = new THREE.AudioListener();
                camera.add(listener);
                const audioLoader = new THREE.AudioLoader();

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setClearColor(new THREE.Color('lightgrey'), 0);
                renderer.setSize(640, 480);
                renderer.domElement.style.position = 'absolute';
                renderer.domElement.style.top = '0px';
                renderer.domElement.style.left = '0px';
                document.body.appendChild(renderer.domElement);

                clock = new THREE.Clock();
                deltaTime = 0;
                totalTime = 0;

                arToolkitSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });

                function onResize() {
                    arToolkitSource.onResize()
                    arToolkitSource.copySizeTo(renderer.domElement)
                    if (arToolkitContext.arController !== null) {
                        arToolkitSource.copySizeTo(arToolkitContext.arController.canvas)
                    }
                }

                arToolkitSource.init(function onReady() { onResize() });
                window.addEventListener('resize', function () { onResize() });

                arToolkitContext = new THREEx.ArToolkitContext({
                    cameraParametersUrl: 'data/camera_para.dat',
                    detectionMode: 'mono_and_matrix',
                    matrixCodeType: "3x3",
                    maxDetectionRate: 60,
                    canvasWidth: 640,
                    canvasHeight: 480
                });

                arToolkitContext.init(function onCompleted() {
                    camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
                });

                mainContainer = new THREE.Group();

                // --------------------------------------------------------
                // НАСТРОЙКИ МАССИВОВ (ИСПРАВЛЕНО)
                // --------------------------------------------------------
                // Назначаем 3-й маркер вашим кастомным pattern-j.patt
                const patternNames = ["", "", "pattern-j.patt"];
                // -1 на третьем месте отключает баркод и включает pattern-j
                const patternBarcode = [1, 2, -1]; 
                const modes = ["image", "image", "image"];
                const modelFiles = ["", "", ""];
                const imageFiles = ["photo_2026-03-26_15-31-26.jpg", "photo_2026-03-26_13-33-33.jpg", "photo_2026-03-26_13-33-20.jpg"];
                const videoFiles = ["", "", ""];
                const audioFiles = [
                    "ElevenLabs_2026-03-26T11_57_55_Roger - Laid-Back, Casual, Resonant_pre_sp100_s50_sb75_se0_b_m2.mp3", 
                    "ElevenLabs_2026-03-26T11_02_58_Roger - Laid-Back, Casual, Resonant_pre_sp100_s50_sb75_se0_b_m2 (1).mp3", 
                    "ElevenLabs_2026_03_26T11_06_00_Roger_Laid_Back,_Casual,_Resonant.mp3"
                ];
                // ИСПРАВЛЕНИЕ: Булевы значения без кавычек, иначе звук будет зациклен навсегда
                const repeatOptions = [false, false, false]; 
                // --------------------------------------------------------

                const markerRoots = [];
                for (let i = 0; i < 3; i++) {
                    markerRoots[i] = new THREE.Group();
                    mainContainer.add(markerRoots[i]);

                    if (patternBarcode[i] === -1) {
                        let markerControls1 = new THREEx.ArMarkerControls(arToolkitContext, markerRoots[i], {
                            type: 'pattern', patternUrl: patternNames[i], size: 1
                        });
                        patternsID.push(patternNames[i]);
                    } else {
                        let markerControls1 = new THREEx.ArMarkerControls(arToolkitContext, markerRoots[i], {
                            type: "barcode", barcodeValue: patternBarcode[i],
                        });
                        barcodesID.push(patternBarcode[i]);
                    }

                    switch (modes[i]) {
                        case 'image':
                            if (imageFiles[i]) {
                                contentPromises.push(new Promise((resolve) => {
                                    let loader = new THREE.TextureLoader();
                                    loader.load(`${imageFiles[i]}`, (texture) => {
                                        let geometry1, ratio = texture.image.naturalWidth / texture.image.naturalHeight;
                                        if (texture.image.naturalHeight < texture.image.naturalWidth) {
                                            geometry1 = new THREE.PlaneBufferGeometry(ratio, 1);
                                        } else {
                                            geometry1 = new THREE.PlaneBufferGeometry(1, 1 / ratio);
                                        }
                                        let material1 = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                                        let mesh1 = new THREE.Mesh(geometry1, material1);
                                        mesh1.rotation.x = -Math.PI / 2;
                                        markerRoots[i].add(mesh1);
                                        resolve(imageFiles[i]);
                                    });
                                }));
                            }
                            break;
                        default:
                            let mesh11 = new THREE.Mesh(new THREE.PlaneBufferGeometry(1, 1), new THREE.MeshBasicMaterial({ color: '#fff' }));
                            mesh11.rotation.x = -Math.PI / 2;
                            markerRoots[i].add(mesh11);
                            break;
                    }

                    if (audioFiles[i]) {
                        contentPromises.push(new Promise((resolve) => {
                            audioLoader.load(`${audioFiles[i]}`, function (buffer) {
                                let sound = new THREE.Audio(listener);
                                sound.name = `${audioFiles[i]}`;
                                sound.setBuffer(buffer);
                                if (repeatOptions[i]) {
                                    sound.setLoop(true);
                                }
                                if (patternBarcode[i] === -1) {
                                    patternsSound.set(i, sound);
                                } else {
                                    barcodesSound.set(patternBarcode[i], sound);
                                }
                                resolve(sound);
                            });
                        }).then((sound) => {
                            console.log(`Audio loaded: ${sound.name}`);
                        }));
                    }
                }

                Promise.all(contentPromises).then(() => {
                    contentInitialized = true;
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 200);
                });

                scene.add(mainContainer);
            }

            function update() {
                if (arToolkitSource.ready !== false) {
                    arToolkitContext.update(arToolkitSource.domElement);
                    if (contentInitialized) {
                        
                        // Проверка баркодов
                        if (barcodesID.length) {
                            barcodesID.forEach((elem) => {
                                if (arToolkitContext.arController.barcodeMarkers[elem].inCurrent) {
                                    let sound = barcodesSound.get(elem);
                                    if (sound && !sound.isPlaying) sound.play();
                                } else {
                                    let sound = barcodesSound.get(elem);
                                    if (sound && sound.isPlaying) {
                                        sound.stop(); 
                                    }
                                }
                            });
                        }

                        // Проверка паттернов
                        if (patternsID.length) {
                            for (let index = 0; index < patternsID.length; index++) {
                                if (arToolkitContext.arController.patternMarkers[index].inCurrent) {
                                    let patternID = (arToolkitContext.arController.patternMarkers[index].markerWidth - 1) * patternIdOffset - 1;
                                    patternID = Math.round(patternID);
                                    let sound = patternsSound.get(patternID) || patternsSound.get(2); // Fallback на индекс массива
                                    if (sound && !sound.isPlaying) sound.play();
                                } else {
                                    let patternID = (arToolkitContext.arController.patternMarkers[index].markerWidth - 1) * patternIdOffset - 1;
                                    patternID = Math.round(patternID);
                                    let sound = patternsSound.get(patternID) || patternsSound.get(2);
                                    if (sound && sound.isPlaying) {
                                        sound.stop();
                                    }
                                }
                            }
                        }
                    }
                }
            }

            function render() {
                renderer.render(scene, camera);
            }

            function animate(time) {
                requestAnimationFrame(animate);
                deltaTime = clock.getDelta();
                totalTime += deltaTime;
                update();
                render();
            }
        }

        access.addEventListener('click', () => {
            // ИСПРАВЛЕНИЕ: Принудительно разблокируем аудио-контекст браузера при клике
            if (THREE.AudioContext && THREE.AudioContext.getContext().state !== 'running') {
                THREE.AudioContext.getContext().resume();
            }
            initiateExperience();
            document.body.removeChild(access);
            loader.style.display = 'block';
        });
    </script>
</body>
</html>
